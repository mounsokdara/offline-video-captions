name: Publish runtime
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Upload native runtime + VAD to the runtime release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view runtime --repo ${{ github.repository }} >/dev/null 2>&1 || \
          gh release create runtime --repo ${{ github.repository }} --latest=false \
            --title "Runtime (downloaded by the app)" --notes "sherpa-onnx v1.13.8 native libs and Silero VAD, fetched by the app on first use."
          curl -sL -o android.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2
          tar xjf android.tar.bz2
          mkdir out
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp jniLibs/$abi/libonnxruntime.so out/$abi-libonnxruntime.so
            cp jniLibs/$abi/libsherpa-onnx-jni.so out/$abi-libsherpa-onnx-jni.so
          done
          curl -sL -o out/silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          ls -la out
          gh release upload runtime out/* --clobber --repo ${{ github.repository }}
