name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [base, small]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Native libraries (sherpa-onnx)
        run: |
          curl -sL -o android.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2
          tar xjf android.tar.bz2
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p app/src/main/jniLibs/$abi
            cp jniLibs/$abi/libonnxruntime.so jniLibs/$abi/libsherpa-onnx-jni.so app/src/main/jniLibs/$abi/
          done

      - name: Whisper ${{ matrix.model }} model + VAD
        run: |
          BASE=https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models
          curl -sL -o m.tar.bz2 $BASE/sherpa-onnx-whisper-${{ matrix.model }}.tar.bz2
          tar xjf m.tar.bz2
          mkdir -p app/src/main/assets/model
          D=sherpa-onnx-whisper-${{ matrix.model }}
          ls -la $D
          cp $D/*-encoder.int8.onnx app/src/main/assets/model/encoder.int8.onnx
          cp $D/*-decoder.int8.onnx app/src/main/assets/model/decoder.int8.onnx
          cp $D/*-tokens.txt app/src/main/assets/model/tokens.txt
          curl -sL -o app/src/main/assets/silero_vad.onnx $BASE/silero_vad.onnx
          du -sh app/src/main/assets

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VideoCaptions-whisper-${{ matrix.model }}.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v2-${{ matrix.model }}-${{ github.run_number }}" VideoCaptions-whisper-${{ matrix.model }}.apk \
            --title "Whisper ${{ matrix.model }} build ${{ github.run_number }}" --notes "Offline video-to-captions APK (Whisper ${{ matrix.model }})"
