name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Native libraries (sherpa-onnx) and VAD model
        run: |
          curl -sL -o android.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2
          tar xjf android.tar.bz2
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p app/src/main/jniLibs/$abi
            cp jniLibs/$abi/libonnxruntime.so jniLibs/$abi/libsherpa-onnx-jni.so app/src/main/jniLibs/$abi/
          done
          mkdir -p app/src/main/assets
          curl -sL -o app/src/main/assets/silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VideoCaptions.apk
          gh release create "v3-${{ github.run_number }}" VideoCaptions.apk \
            --title "Video Captions build ${{ github.run_number }}" \
            --notes "Offline video-to-captions APK. Whisper model is downloaded by the app on first use."
